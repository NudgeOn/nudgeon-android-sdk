name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, library AAR, sample APK
        run: ./gradlew :onda:testDebugUnitTest :onda:assembleRelease :sample-app:assembleDebug --no-daemon

      - name: Upload sample APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sample-app-debug
          path: sample-app/build/outputs/apk/debug/sample-app-debug.apk
          if-no-files-found: error
